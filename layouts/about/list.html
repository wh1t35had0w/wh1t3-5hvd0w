{{ define "main" }}
{{ range .Pages }}
<div class="terminal-container" style="max-width:860px;margin:60px auto;padding:0 20px;">
  <div style="background:#1a1a2e;border:1px solid #2a2a4e;border-radius:14px;overflow:hidden;">

    <!-- Terminal top bar -->
    <div style="background:#0d1117;padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2a4e;">
      <span style="width:12px;height:12px;border-radius:50%;background:#ff5f57;display:inline-block;"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#febc2e;display:inline-block;"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#28c840;display:inline-block;"></span>
      <span style="font-family:monospace;font-size:0.8rem;color:#666;margin-left:8px;">About Me.md</span>
    </div>

    <!-- Terminal body -->
    <div style="padding:28px 32px;font-family:monospace;">

      <!-- Command line -->
      <p style="color:#00ff88;margin:0 0 24px;">$ cat About Me.md</p>

      <!-- Profile Image -->
      <div style="margin-bottom:28px;">
        <img src="/images/profile.png"
          onerror="this.style.display='none'"
          style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid #667eea;box-shadow:0 0 20px rgba(102,126,234,0.3);" />
      </div>

      <!-- Content -->
      <div style="color:#ccc;line-height:1.9;font-size:0.92rem;" class="about-content">
        {{ .Content }}
      </div>

    </div>
  </div>
</div>
{{ end }}

<style>
.about-content h1 { color:#667eea; font-size:1.5rem; margin:0 0 16px; }
.about-content h2 { color:#00ff88; font-size:1.1rem; margin:28px 0 10px; }
.about-content h3 { color:#a78bfa; font-size:1rem; margin:20px 0 8px; }
.about-content p  { margin-bottom:14px; }
.about-content strong { color:#a78bfa; }
.about-content ul { padding-left:20px; margin-bottom:14px; }
.about-content li { margin-bottom:6px; }
.about-content code { background:#0d1117; color:#00ff88; padding:2px 8px; border-radius:4px; }
.about-content pre { background:#0d1117; border:1px solid #1e2a3a; border-radius:8px; padding:16px; overflow-x:auto; margin:16px 0; }
.about-content pre code { background:none; padding:0; }
</style>

{{ end }}
